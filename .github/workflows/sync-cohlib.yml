name: Sync cohlib

on:
  repository_dispatch:
    types: [cohlib-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: dtolnay/rust-toolchain@stable

      - name: Update cohlib-rb to latest
        run: cargo update -p cohlib-rb --manifest-path ext/cohlib/Cargo.toml

      - name: Check build
        run: cargo check --manifest-path ext/cohlib/Cargo.toml

      - name: Commit updated Cargo.lock
        id: commit
        run: |
          git diff --quiet ext/cohlib/Cargo.lock && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ext/cohlib/Cargo.lock
          git commit -m "chore: update cohlib to ${{ github.event.client_payload.sha }}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Only notify cohdb when the upstream dispatch came from update-game-data
      # (i.e., a real new patch). Generic cohlib pushes via notify-cohlib-rb
      # do not include a `version` field and must not trigger the patch sync.
      - name: Notify cohdb of new cohlib build
        if: steps.commit.outputs.committed == 'true' && github.event.client_payload.version != ''
        run: |
          gh api repos/ryantaylor/next/dispatches \
            -f event_type=cohlib-rb-bumped \
            -F "client_payload[build_number]=${{ github.event.client_payload.version }}" \
            -F "client_payload[cohlib_release_tag]=${{ github.event.client_payload.release_tag }}"
        env:
          GH_TOKEN: ${{ secrets.COHDB_DISPATCH_TOKEN }}
